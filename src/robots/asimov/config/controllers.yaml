controller_manager:
  ros__parameters:
    update_rate: 50

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    diff_drive_controller:
      type: diff_drive_controller/DiffDriveController

diff_drive_controller:
  ros__parameters:
    left_wheel_names:
      - fl-wheel
      - rl-wheel
    right_wheel_names:
      - fr-wheel
      - rr-wheel
    wheel_separation: 0.547257  # distance between left and right wheels (m)
    wheel_radius: 0.075         # wheel radius (m) - adjust to your actual wheel size
    publish_rate: 50.0
    odom_frame_id: odom
    base_frame_id: base_link
    use_stamped_vel: false
